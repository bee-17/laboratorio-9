<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Productos</h2>
    <a routerLink="/productos/crear" class="btn btn-primary">Agregar Producto</a>
  </div>
  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Stock</th>
        <th>Categoría</th>
        <th width="180">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos">
        <td>{{ p.nombre }}</td>
        <td>{{ p.precio }}</td>
        <td>{{ p.stock }}</td>
        <td>{{ p.categoria?.nombre }}</td>
        <td>
          <a [routerLink]="['/productos/editar', p._id]" class="btn btn-warning btn-sm me-2">Editar</a>
          <button class="btn btn-danger btn-sm" (click)="eliminar(p._id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
